<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Write - Ren Sun</title>
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="img/icons/favicon-192.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="blog-page">
    <a class="blog-home" href="blog.html">← back to the blog</a>
    <h1 class="blog-title blog-admin-title">new entry</h1>

    <main class="blog-admin">
      <p class="admin-note" id="local-note" hidden>
        Supabase isn't set up yet, so entries you add here are only saved in
        this browser (handy for trying it out). Follow
        <code>docs/SUPABASE-SETUP.md</code> to publish them for everyone.
      </p>

      <form class="admin-panel" id="sign-in" hidden>
        <h2>Sign in to write</h2>
        <label class="admin-field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
        <button class="admin-submit" type="submit">
          Email me a sign-in link
        </button>
        <p class="admin-status" role="status"></p>
      </form>

      <form class="admin-panel" id="entry-form" hidden>
        <p class="admin-who" id="who"></p>

        <label class="admin-field">
          <span>Title</span>
          <input
            name="title"
            required
            maxlength="100"
            placeholder="What happened"
          />
        </label>

        <label class="admin-field">
          <span>Date</span>
          <input name="date" type="date" required />
        </label>

        <label class="admin-field">
          <span>Upload photo</span>
          <input name="photo" type="file" accept="image/*" required />
          <img class="admin-preview" alt="" hidden />
        </label>

        <label class="admin-field">
          <span>Journal <small>(max 300 characters)</small></span>
          <textarea name="journal" required maxlength="300" rows="6"></textarea>
          <small class="admin-count">0 / 300</small>
        </label>

        <button class="admin-submit" type="submit">Add to the blog</button>
        <p class="admin-status" role="status"></p>
      </form>

      <section class="admin-panel" id="entries" hidden>
        <h2>Your entries</h2>
        <ul class="admin-entries"></ul>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/blog-admin.js"></script>
  </body>
</html>
